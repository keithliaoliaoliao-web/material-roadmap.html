<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>材料研發進度與架構結構圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E7ECEA;
    --bg-grid: rgba(20,48,63,0.055);
    --surface: #F4F6F4;
    --surface-2: #FFFFFF;
    --ink: #16303B;
    --ink-dim: #5B7480;
    --line: rgba(22,48,59,0.18);
    --line-strong: rgba(22,48,59,0.34);
    --accent: #2E6E7E;
    --danger: #B0503F;
    --st-planned: #6E8492;
    --st-active: #C97F1E;
    --st-validating: #2E8FA1;
    --st-done: #4C8F5B;
    --st-hold: #B0503F;
    --shadow: 0 1px 0 rgba(22,48,59,0.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F2A3A; --bg-grid: rgba(255,255,255,0.045);
      --surface: #143247; --surface-2: #1B3E56;
      --ink: #E9F1F3; --ink-dim: #93AEBB;
      --line: rgba(233,241,243,0.16); --line-strong: rgba(233,241,243,0.32);
      --accent: #6FC3D6; --danger: #E08571;
      --st-planned: #8CA0AC; --st-active: #E8A33D; --st-validating: #5EC8D8;
      --st-done: #7FB77E; --st-hold: #D98572;
      --shadow: 0 1px 0 rgba(0,0,0,0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F2A3A; --bg-grid: rgba(255,255,255,0.045);
    --surface: #143247; --surface-2: #1B3E56;
    --ink: #E9F1F3; --ink-dim: #93AEBB;
    --line: rgba(233,241,243,0.16); --line-strong: rgba(233,241,243,0.32);
    --accent: #6FC3D6; --danger: #E08571;
    --st-planned: #8CA0AC; --st-active: #E8A33D; --st-validating: #5EC8D8;
    --st-done: #7FB77E; --st-hold: #D98572;
    --shadow: 0 1px 0 rgba(0,0,0,0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 100%,
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 16px 24px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--line-strong);
    background: var(--surface-2); color: var(--ink);
    padding: 7px 12px; border-radius: 6px; font-size: 13px;
    transition: border-color .15s ease, transform .1s ease;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); color: var(--surface-2); border-color: var(--accent); }
  button.ghost { background: transparent; }
  button.small { padding: 3px 8px; font-size: 12px; border-radius: 5px; }
  button.icon { padding: 2px 6px; line-height: 1; }

  main { padding: 24px; max-width: 1380px; margin: 0 auto; }

  section.panel {
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  section.panel > h2 {
    font-size: 13px; color: var(--ink-dim); font-weight: 600; margin: 0 0 16px 0;
  }

  /* ---------- Combined tree + timeline grid ---------- */
  .roadmap-wrap { overflow-x: auto; }
  .roadmap-grid {
    position: relative;
    display: grid;
    grid-template-columns: 340px 1fr;
    min-width: 800px;
  }
  .cell {
    border-top: 1px solid var(--line);
    display: flex; align-items: center;
    min-height: 48px;
  }
  .roadmap-grid > .cell:nth-child(-n+2) { border-top: none; }
  .cell.left { padding: 4px 10px 4px 4px; gap: 6px; }
  .cell.right { position: relative; padding: 0 8px; }
  .cell.header-left { color: var(--ink-dim); font-size: 12px; font-weight: 600; }
  .cell.header-right { min-height: 30px; position: relative; }

  .indent { display: inline-block; flex: none; }
  .node {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px;
    cursor: pointer; max-width: 100%;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .node:hover { border-color: var(--accent); }
  .node.system-node { font-weight: 600; border-width: 1.5px; }
  .node.highlight { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .node .label { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .progress-pill {
    font-size: 10px; color: var(--ink-dim); background: var(--surface);
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); margin-left: 2px;
  }
  .row-actions { display: none; gap: 3px; flex: none; }
  .cell.left:hover .row-actions { display: inline-flex; }

  .month-tick {
    position: absolute; top: 0; bottom: 0; font-size: 11px; color: var(--ink-dim);
    border-left: 1px solid var(--line); padding-left: 4px;
  }
  .bg-gridline {
    position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line);
  }
  .gantt-bar {
    position: absolute; top: 11px; height: 26px; border-radius: 5px;
    font-size: 11px; color: #0c1c22; display: flex; align-items: center;
    padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; border: 1px solid rgba(0,0,0,0.15);
  }
  .gantt-bar.highlight { outline: 2px solid var(--ink); outline-offset: 1px; }
  .today-line {
    position: absolute; top: 0; bottom: 0; width: 1px; background: var(--danger); z-index: 3; pointer-events: none;
  }
  .today-line .lbl {
    position: absolute; top: -18px; left: 3px; font-size: 10px; color: var(--danger);
    font-family: "IBM Plex Mono", monospace; white-space: nowrap;
  }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-dim); margin-top: 14px; }
  .legend span.item { display: inline-flex; align-items: center; gap: 6px; }

  .empty-hint {
    color: var(--ink-dim); font-size: 13px; padding: 20px; text-align: center;
    border: 1px dashed var(--line); border-radius: 8px;
  }

  /* ---------- Edit drawer ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,20,26,0.35);
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 30;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 94vw);
    background: var(--surface-2); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .2s ease;
    z-index: 31; padding: 24px; overflow-y: auto;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h3 { margin: 0 0 16px 0; font-size: 15px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; font: inherit; font-size: 13px; padding: 8px 9px;
    border: 1px solid var(--line-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink);
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .drawer-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }

  /* JSON 編輯檢視對話框 */
  #jsonModal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(720px, 90vw); background: var(--surface-2); border: 1px solid var(--line-strong);
    border-radius: 8px; z-index: 40; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  #jsonModal textarea {
    width: 100%; height: 350px; font-family: "IBM Plex Mono", monospace; font-size: 12px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 10px; border-radius: 6px;
  }

  footer { text-align: center; font-size: 11.5px; color: var(--ink-dim); padding: 12px 24px 32px; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="projectTitle">材料開發進度圖</h1>
    <div class="sub" id="projectMeta">心智圖節點與時間軸色塊在同一列上，天生對齊</div>
  </div>
  <div class="toolbar">
    <button class="ghost small" id="btnTheme" title="切換淺色／深色">◐ 切換主題</button>
    <button class="small" id="btnEditJson">檢視 / 貼上 JSON</button>
    <button class="small" id="btnExport">匯出 JSON</button>
    <button class="small" id="btnImport">匯入 JSON</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none">
    <button class="primary small" id="btnAddRoot">＋ 新增系統主幹</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>研發階層／配方與驗證（左）與排程期程（右）—— 同列嚴密對齊</h2>
    <div class="roadmap-wrap">
      <div class="roadmap-grid" id="roadmapGrid"></div>
    </div>
    <div class="legend" id="legendMap"></div>
  </section>
</main>

<footer>
  單一 HTML 檔案，支援部署於 GitHub Pages；完全相容 Core Schema，隨時點擊「匯出 JSON」備份與版本控制。
</footer>

<!-- 編輯抽屜 (Drawer) -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <h3 id="drawerTitle">編輯節點</h3>
  <form id="editForm">
    <div class="field">
      <label>節點名稱 (Topic)</label>
      <input type="text" id="fTopic" required>
    </div>
    <div class="row">
      <div class="field">
        <label>類別 (Category)</label>
        <select id="fCategory">
          <option value="system">系統主幹 (System)</option>
          <option value="formulation">配方研發 (Formulation)</option>
          <option value="testing">物性驗證 (Testing)</option>
          <option value="milestone">關鍵里程碑 (Milestone)</option>
        </select>
      </div>
      <div class="field">
        <label>狀態 (Status)</label>
        <select id="fStatus">
          <option value="planned">規劃中</option>
          <option value="in_progress">研發中</option>
          <option value="validating">驗證中</option>
          <option value="completed">已完成</option>
          <option value="blocked">暫停/瓶頸</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>進度 (%)</label>
        <input type="number" id="fProgress" min="0" max="100" value="0">
      </div>
      <div class="field">
        <label>父節點 ID (Parent ID)</label>
        <input type="text" id="fParentId" placeholder="root 或其他節點 ID">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>開始日期</label>
        <input type="date" id="fStart">
      </div>
      <div class="field">
        <label>結束日期</label>
        <input type="date" id="fEnd">
      </div>
    </div>
    
    <!-- Core Schema Details 欄位 -->
    <div class="field">
      <label>關鍵配方比 / 工藝參數 (params)</label>
      <textarea id="fParams" placeholder="例如：主劑/硬化劑=100:15，固化條件 120°C/2hr"></textarea>
    </div>
    <div class="field">
      <label>目標 / 實測物性指標 (metrics)</label>
      <textarea id="fMetrics" placeholder="例如：Tg 150°C, 拉伸強度 60MPa, 接觸角 105°"></textarea>
    </div>
    <div class="field">
      <label>關鍵觀察 / 卡關瓶頸 (notes)</label>
      <textarea id="fNotes" placeholder="觀察紀錄、待排除問題或推估原因..."></textarea>
    </div>

    <div class="drawer-actions">
      <button type="button" class="ghost small" id="btnDelete">刪除此節點</button>
      <div style="display:flex; gap:8px;">
        <button type="button" class="ghost small" id="btnCancel">取消</button>
        <button type="submit" class="primary small">儲存變更</button>
      </div>
    </div>
  </form>
</div>

<!-- JSON 編輯與貼上對話框 -->
<div id="jsonModal">
  <h3 style="margin-bottom:12px; font-size:15px;">直接編輯 / 載入 Core Schema JSON</h3>
  <textarea id="jsonRawText" spellcheck="false"></textarea>
  <div style="display:flex; justify-content: flex-end; gap:8px; margin-top:12px;">
    <button class="ghost small" onclick="closeJsonModal()">取消</button>
    <button class="primary small" onclick="applyJsonModal()">載入並渲染</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "material-core-schema-v1";
  var STATUS_LABEL = { planned:"規劃中", in_progress:"研發中", validating:"驗證中", completed:"已完成", blocked:"暫停/瓶頸" };
  var STATUS_VAR = { planned:"--st-planned", in_progress:"--st-active", validating:"--st-validating", completed:"--st-done", blocked:"--st-hold" };

  function uid(){ return "node_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

  // 初始預設種子資料（完全符合 Core Schema）
  function seedData(){
    return {
      "project": "高Tg耐熱環氧樹脂複合材料開發",
      "updated_at": "2026-09-17",
      "nodes": [
        {
          "id": "root_01",
          "parent_id": "root",
          "topic": "耐熱樹脂體系開發",
          "category": "system",
          "start_date": "2026-09-01",
          "end_date": "2026-10-31",
          "progress": 30,
          "status": "in_progress",
          "details": {
            "params": "基準體系：雙酚A型環氧 (DGEBA) + 芳香胺固化劑",
            "metrics": "目標：Tg ≥ 180°C，耐熱裂解溫度 > 320°C",
            "notes": "專案核心主幹"
          }
        },
        {
          "id": "form_01",
          "parent_id": "root_01",
          "topic": "配方 A (DDS 硬化劑配比篩選)",
          "category": "formulation",
          "start_date": "2026-09-01",
          "end_date": "2026-09-18",
          "progress": 100,
          "status": "completed",
          "details": {
            "params": "環氧當量比 1.0 : 0.95，固化條件 180°C/2hr",
            "metrics": "實測 DSC Tg: 184°C",
            "notes": "反應完全，但黏度較高，加工窗口偏窄"
          }
        },
        {
          "id": "form_02",
          "parent_id": "root_01",
          "topic": "配方 B (活性稀釋劑降黏試驗)",
          "category": "formulation",
          "start_date": "2026-09-19",
          "end_date": "2026-10-05",
          "progress": 25,
          "status": "in_progress",
          "details": {
            "params": "添加 5wt% 脂環族環氧稀釋劑",
            "metrics": "預估流體黏度降至 1200 cps",
            "notes": "[推估] 評估稀釋劑是否造成耐熱性衰退"
          }
        },
        {
          "id": "test_01",
          "parent_id": "form_02",
          "topic": "DMA 動態熱機械分析",
          "category": "testing",
          "start_date": "2026-10-06",
          "end_date": "2026-10-15",
          "progress": 0,
          "status": "planned",
          "details": {
            "params": "升溫速率 3°C/min，頻率 1Hz",
            "metrics": "測量損耗因子 Tan Delta 峰值",
            "notes": "[推估] 樣條成型後排測"
          }
        }
      ]
    };
  }

  var state = null;

  function loadState(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch(e){}
    if (!state) state = seedData();
    renderAll();
  }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){ console.error(e); }
  }

  function addDays(date, n){ var d = new Date(date); d.setDate(d.getDate()+n); return d; }

  // ---------- 階層樹狀平坦化處理 ----------
  function getFlattenedNodes(nodes){
    var result = [];
    var childrenMap = {};
    nodes.forEach(function(n){
      var pid = (!n.parent_id || n.parent_id === "root") ? "root" : n.parent_id;
      if (!childrenMap[pid]) childrenMap[pid] = [];
      childrenMap[pid].push(n);
    });

    function traverse(pid, depth){
      var list = childrenMap[pid] || [];
      list.forEach(function(node){
        result.push({ node: node, depth: depth });
        traverse(node.id, depth + 1);
      });
    }
    traverse("root", 0);

    // 防呆：若有孤立節點（parent_id 找不到），附加在最下方
    var visited = {};
    result.forEach(function(r){ visited[r.node.id] = true; });
    nodes.forEach(function(n){
      if (!visited[n.id]) result.push({ node: n, depth: 0 });
    });

    return result;
  }

  // ---------- 主要繪製邏輯 ----------
  function renderAll(){
    document.getElementById("projectTitle").textContent = state.project || "未命名材料專案";
    document.getElementById("projectMeta").textContent = "最後更新日期: " + (state.updated_at || "-") + " ｜ 點選節點或色塊檢視配方與物性";

    var grid = document.getElementById("roadmapGrid");
    grid.innerHTML = "";

    var flatList = getFlattenedNodes(state.nodes || []);

    // 彙整具備起訖日期的節點計算時間軸尺規
    var datedNodes = flatList.map(function(item){ return item.node; }).filter(function(n){ return n.start_date && n.end_date; });
    var minDate, maxDate, totalMs, hasScale = false;
    if (datedNodes.length){
      hasScale = true;
      minDate = addDays(new Date(Math.min.apply(null, datedNodes.map(function(n){ return new Date(n.start_date).getTime(); }))), -7);
      maxDate = addDays(new Date(Math.max.apply(null, datedNodes.map(function(n){ return new Date(n.end_date).getTime(); }))), 7);
      totalMs = maxDate.getTime() - minDate.getTime();
    }

    // 頂部表頭列
    grid.appendChild(makeCell("left header-left", "材料架構 / 實驗階段 (Topic)"));
    var headerRight = makeCell("right header-right", "");
    if (hasScale){
      var cursor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
      while (cursor <= maxDate){
        var pct = ((cursor.getTime() - minDate.getTime()) / totalMs) * 100;
        var tick = document.createElement("div");
        tick.className = "month-tick mono";
        tick.style.left = pct + "%";
        tick.textContent = cursor.getFullYear() + "/" + (cursor.getMonth()+1) + "月";
        headerRight.appendChild(tick);
        cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
      }
    }
    grid.appendChild(headerRight);

    if (!flatList.length){
      grid.appendChild(makeCell("left", ""));
      var emptyRight = makeCell("right", "");
      emptyRight.innerHTML = '<div class="empty-hint" style="width:100%">尚無任何研發節點，點右上角「＋ 新增系統主幹」開始建立。</div>';
      grid.appendChild(emptyRight);
    }

    // 繪製每一筆節點（左欄樹狀 + 右欄甘特圖色塊）
    flatList.forEach(function(item){
      var node = item.node;
      var depth = item.depth;

      // 1. 左側欄：樹狀節點與操作按鈕
      grid.appendChild(buildLeftCell(node, depth));

      // 2. 右側欄：時間軸色塊
      var cellRight = makeCell("right", "");
      if (hasScale){
        addGridlines(cellRight, minDate, maxDate, totalMs);
        if (node.start_date && node.end_date){
          var ps = new Date(node.start_date).getTime();
          var pe = new Date(node.end_date).getTime();
          var bar = document.createElement("div");
          bar.className = "gantt-bar mono";
          bar.dataset.nodeId = node.id;
          bar.style.left = (((ps - minDate.getTime())/totalMs)*100) + "%";
          bar.style.width = Math.max((((pe - ps)/totalMs)*100), 1.2) + "%";
          bar.style.background = "var(" + (STATUS_VAR[node.status] || "--st-planned") + ")";
          bar.textContent = node.topic;
          bar.title = node.topic + " [" + (STATUS_LABEL[node.status] || node.status) + "] " + node.start_date + " → " + node.end_date;
          bar.onclick = function(){ openDrawer(node); highlightPair(node.id); };
          cellRight.appendChild(bar);
        }
      }
      grid.appendChild(cellRight);
    });

    // 繪製「今天」時間標記線
    if (hasScale){
      var today = new Date();
      if (today >= minDate && today <= maxDate){
        requestAnimationFrame(function(){ drawTodayLine(grid, minDate, maxDate, totalMs); });
      }
    }

    renderLegend();
  }

  function makeCell(cls, text){
    var d = document.createElement("div");
    d.className = "cell " + cls;
    if (text) d.textContent = text;
    return d;
  }

  function addGridlines(container, minDate, maxDate, totalMs){
    var cursor = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    while (cursor <= maxDate){
      var pct = ((cursor.getTime() - minDate.getTime()) / totalMs) * 100;
      var line = document.createElement("div");
      line.className = "bg-gridline";
      line.style.left = pct + "%";
      container.appendChild(line);
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    }
  }

  function drawTodayLine(grid, minDate, maxDate, totalMs){
    var old = grid.querySelector(".today-line");
    if (old) old.remove();
    var firstRightCell = grid.querySelector(".cell.right");
    if (!firstRightCell) return;
    var gridRect = grid.getBoundingClientRect();
    var rightRect = firstRightCell.getBoundingClientRect();
    var pct = ((new Date().getTime() - minDate.getTime()) / totalMs);
    var leftPx = (rightRect.left - gridRect.left) + pct * rightRect.width;
    var line = document.createElement("div");
    line.className = "today-line";
    line.style.left = leftPx + "px";
    line.innerHTML = '<span class="lbl">今天</span>';
    grid.appendChild(line);
  }

  function buildLeftCell(node, depth){
    var cell = makeCell("left", "");
    var indent = document.createElement("span");
    indent.className = "indent";
    indent.style.width = (depth * 20) + "px";
    cell.appendChild(indent);

    var wrap = document.createElement("div");
    wrap.className = "node" + (node.category === "system" ? " system-node" : "");
    wrap.dataset.nodeId = node.id;

    var dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = "var(" + (STATUS_VAR[node.status] || "--st-planned") + ")";
    wrap.appendChild(dot);

    var label = document.createElement("span");
    label.className = "label";
    label.textContent = node.topic;
    wrap.appendChild(label);

    if (node.progress !== undefined && node.progress !== null){
      var prog = document.createElement("span");
      prog.className = "progress-pill mono";
      prog.textContent = node.progress + "%";
      wrap.appendChild(prog);
    }

    wrap.onclick = function(){ openDrawer(node); highlightPair(node.id); };
    cell.appendChild(wrap);

    var actions = document.createElement("span");
    actions.className = "row-actions";
    
    // 快捷：新增子節點按鈕
    var addSubBtn = document.createElement("button");
    addSubBtn.className = "icon small ghost"; addSubBtn.textContent = "＋";
    addSubBtn.title = "在此節點下新增子項目";
    addSubBtn.onclick = function(ev){ ev.stopPropagation(); openDrawer(null, node.id); };
    actions.appendChild(addSubBtn);

    var editBtn = document.createElement("button");
    editBtn.className = "icon small ghost"; editBtn.textContent = "✎";
    editBtn.title = "編輯節點詳情";
    editBtn.onclick = function(ev){ ev.stopPropagation(); openDrawer(node); };
    actions.appendChild(editBtn);

    cell.appendChild(actions);
    return cell;
  }

  function highlightPair(nodeId){
    document.querySelectorAll(".node.highlight, .gantt-bar.highlight").forEach(function(el){
      el.classList.remove("highlight");
    });
    document.querySelectorAll('[data-node-id="' + nodeId + '"]').forEach(function(el){
      el.classList.add("highlight");
    });
  }

  function renderLegend(){
    var el = document.getElementById("legendMap");
    el.innerHTML = "";
    Object.keys(STATUS_LABEL).forEach(function(key){
      var span = document.createElement("span");
      span.className = "item";
      span.innerHTML = '<span class="dot" style="width:8px;height:8px;background:var(' + STATUS_VAR[key] + ')"></span>' + STATUS_LABEL[key];
      el.appendChild(span);
    });
  }

  // ---------- 抽屜編輯表單邏輯 ----------
  var editingNode = null;
  var isNew = false;

  function openDrawer(node, defaultParentId){
    isNew = !node;
    editingNode = node || {
      id: uid(),
      parent_id: defaultParentId || "root",
      topic: "",
      category: defaultParentId ? "formulation" : "system",
      start_date: "",
      end_date: "",
      progress: 0,
      status: "planned",
      details: { params: "", metrics: "", notes: "" }
    };

    document.getElementById("drawerTitle").textContent = isNew ? "新增研發節點" : "編輯研發節點";
    document.getElementById("fTopic").value = editingNode.topic || "";
    document.getElementById("fCategory").value = editingNode.category || "formulation";
    document.getElementById("fStatus").value = editingNode.status || "planned";
    document.getElementById("fProgress").value = editingNode.progress || 0;
    document.getElementById("fParentId").value = editingNode.parent_id || "root";
    document.getElementById("fStart").value = editingNode.start_date || "";
    document.getElementById("fEnd").value = editingNode.end_date || "";

    var d = editingNode.details || {};
    document.getElementById("fParams").value = d.params || "";
    document.getElementById("fMetrics").value = d.metrics || "";
    document.getElementById("fNotes").value = d.notes || "";

    document.getElementById("btnDelete").style.display = isNew ? "none" : "inline-block";
    document.getElementById("overlay").classList.add("open");
    document.getElementById("drawer").classList.add("open");
    document.getElementById("fTopic").focus();
  }

  function closeDrawer(){
    document.getElementById("overlay").classList.remove("open");
    document.getElementById("drawer").classList.remove("open");
  }

  document.getElementById("editForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    editingNode.topic = document.getElementById("fTopic").value.trim() || "未命名節點";
    editingNode.category = document.getElementById("fCategory").value;
    editingNode.status = document.getElementById("fStatus").value;
    editingNode.progress = parseInt(document.getElementById("fProgress").value, 10) || 0;
    editingNode.parent_id = document.getElementById("fParentId").value.trim() || "root";
    editingNode.start_date = document.getElementById("fStart").value;
    editingNode.end_date = document.getElementById("fEnd").value;
    editingNode.details = {
      params: document.getElementById("fParams").value,
      metrics: document.getElementById("fMetrics").value,
      notes: document.getElementById("fNotes").value
    };

    if (isNew){
      state.nodes.push(editingNode);
    }
    state.updated_at = new Date().toISOString().split("T")[0];
    saveState();
    renderAll();
    closeDrawer();
  });

  document.getElementById("btnCancel").onclick = closeDrawer;
  document.getElementById("overlay").onclick = closeDrawer;

  document.getElementById("btnDelete").onclick = function(){
    if (!confirm("確定要刪除「" + editingNode.topic + "」嗎？此動作將連同該節點一併移除。")) return;
    state.nodes = state.nodes.filter(function(n){ return n.id !== editingNode.id; });
    saveState();
    renderAll();
    closeDrawer();
  };

  document.getElementById("btnAddRoot").onclick = function(){ openDrawer(null, "root"); };

  // ---------- 檢視與直接貼上 JSON 對話框 ----------
  window.closeJsonModal = function(){
    document.getElementById("jsonModal").style.display = "none";
    document.getElementById("overlay").classList.remove("open");
  };

  window.applyJsonModal = function(){
    try {
      var parsed = JSON.parse(document.getElementById("jsonRawText").value);
      if (!parsed.nodes || !Array.isArray(parsed.nodes)){
        throw new Error("格式不符合 Core Schema：缺少 nodes 陣列");
      }
      state = parsed;
      saveState();
      renderAll();
      closeJsonModal();
      alert("JSON 載入並渲染成功！");
    } catch(err){
      alert("JSON 解析失敗：" + err.message);
    }
  };

  document.getElementById("btnEditJson").onclick = function(){
    document.getElementById("jsonRawText").value = JSON.stringify(state, null, 2);
    document.getElementById("overlay").classList.add("open");
    document.getElementById("jsonModal").style.display = "block";
  };

  // ---------- 檔案匯出 / 匯入 ----------
  document.getElementById("btnExport").onclick = function(){
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = (state.project || "material-rd-roadmap") + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  document.getElementById("btnImport").onclick = function(){ document.getElementById("fileImport").click(); };
  document.getElementById("fileImport").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var json = JSON.parse(reader.result);
        if (!json.nodes) throw new Error("缺少 nodes 節點資料");
        state = json;
        saveState();
        renderAll();
        alert("匯入成功！");
      } catch(e){ alert("匯入失敗：" + e.message); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  // ---------- 主題切換 ----------
  document.getElementById("btnTheme").onclick = function(){
    var root = document.documentElement;
    var current = root.getAttribute("data-theme");
    if (current === "dark") root.setAttribute("data-theme", "light");
    else if (current === "light") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", "dark");
  };

  window.addEventListener("resize", function(){
    var grid = document.getElementById("roadmapGrid");
    if (grid) renderAll();
  });

  loadState();

})();
</script>
</body>
</html>
